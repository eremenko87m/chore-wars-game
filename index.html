<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a78dc">
<title>Chore Wars — Summer House Mission</title>
<style>
:root{--blue:#0877dc;--deep:#072b66;--cyan:#65dcff;--gold:#ffd441;--orange:#ff9e1b;--green:#26bf69;--red:#f25656;--purple:#8256e8;--ink:#082451;--panel:rgba(255,255,255,.96)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Trebuchet MS,Arial,sans-serif;background:#c9efff;color:#fff}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
body{min-height:100vh;background:linear-gradient(180deg,#bdf1ff 0,#eafaff 55%,#b8e6ff 100%)}
.app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.stage{position:relative;width:min(100%,1600px);aspect-ratio:16/9;overflow:hidden;border-radius:22px;background:#47a7ed;box-shadow:0 22px 60px rgba(14,75,120,.3);isolation:isolate}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;user-select:none;pointer-events:none}
.scrim{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,30,80,.06),rgba(0,30,80,.02) 68%,rgba(0,30,80,.12))}
.hud{position:absolute;z-index:20;left:1.2%;right:1.2%;top:1.2%;display:flex;gap:8px;align-items:center;pointer-events:none}.hud.hidden{display:none}
.progressCard{flex:1;min-width:240px;background:rgba(5,48,108,.92);border:2px solid #8ce3ff;border-radius:14px;padding:7px 11px;display:flex;align-items:center;gap:9px;box-shadow:0 5px 18px rgba(0,0,0,.2)}
.progressLabel{font-size:clamp(10px,.9vw,14px);font-weight:1000;white-space:nowrap}.progressTrack{height:12px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;flex:1}.progressFill{height:100%;width:0;background:linear-gradient(90deg,#62e7ff,#ffd64c);transition:.35s}.progressText{font-weight:1000;white-space:nowrap}
.scoreboard{display:grid;grid-template-columns:repeat(4,minmax(82px,1fr));gap:5px;min-width:40%;pointer-events:auto}.player{border:2px solid rgba(255,255,255,.85);background:rgba(5,48,108,.93);color:#fff;border-radius:13px;padding:7px 8px;display:flex;justify-content:space-between;gap:6px;align-items:center;font-weight:1000;box-shadow:0 5px 14px rgba(0,0,0,.18)}.player.active{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,212,65,.28),0 5px 14px rgba(0,0,0,.18)}.player span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score{background:var(--gold);color:#5a3400;border-radius:99px;min-width:28px;text-align:center;padding:2px 6px}
.topActions{position:absolute;z-index:28;top:9.3%;right:1.2%;display:flex;gap:6px}.topActions.start{top:1.5%}.tinyBtn,.navBtn,.turnBtn{border:2px solid #fff;background:rgba(5,48,108,.94);color:#fff;border-radius:11px;padding:7px 10px;font-size:clamp(10px,.8vw,13px);font-weight:1000;box-shadow:0 4px 12px rgba(0,0,0,.2)}.tinyBtn:hover,.navBtn:hover,.turnBtn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.setup{position:absolute;z-index:30;left:50%;bottom:3.5%;transform:translateX(-50%);width:min(90%,920px);background:rgba(255,255,255,.97);color:var(--ink);border:4px solid #5cd7ff;border-radius:20px;padding:15px 17px;box-shadow:0 16px 35px rgba(0,67,132,.28);text-align:center}.setup h2{margin:0 0 3px;color:#0864c2;font-size:clamp(18px,2vw,30px)}.setup p{margin:4px 0 11px;font-weight:800}.nameGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.nameGrid label{font-size:12px;font-weight:900;text-align:left}.nameGrid input{width:100%;padding:8px 9px;margin-top:4px;border:2px solid #84dfff;border-radius:10px;color:var(--ink);font-weight:900;background:#fff}.startBtn{margin-top:11px;border:0;border-radius:14px;padding:11px 25px;background:linear-gradient(#ffe968,#ffab19);color:#553400;font-size:clamp(18px,1.7vw,28px);font-weight:1000;box-shadow:0 6px 0 #b96600,0 10px 20px rgba(0,0,0,.2)}.startBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #b96600}
.overlay{position:absolute;z-index:12;inset:0;pointer-events:none}.panel{pointer-events:auto;background:var(--panel);color:var(--ink);border:4px solid #67dafa;border-radius:18px;box-shadow:0 12px 28px rgba(0,60,120,.28)}.missionPanel{position:absolute;left:50%;bottom:8.8%;transform:translateX(-50%);width:min(92%,980px);padding:11px 14px}.missionTitle{font-weight:1000;text-align:center;color:#075fb8;font-size:clamp(16px,1.55vw,25px);margin-bottom:7px}.prompt{font-size:clamp(18px,1.8vw,30px);font-weight:1000;text-align:center;margin:5px 0}.subprompt{font-size:clamp(12px,1.05vw,17px);font-weight:800;text-align:center;color:#36516e}.buttonRow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:9px}.gameBtn{border:3px solid #0a74cf;background:#fff;color:#0753a2;border-radius:12px;padding:8px 13px;font-weight:1000;box-shadow:0 5px 0 #7eb9df;transition:.12s}.gameBtn:hover{transform:translateY(-2px);border-color:#ffb51c}.gameBtn:active{transform:translateY(2px);box-shadow:0 2px 0 #7eb9df}.goodBtn{border-color:#168f4c;background:#eaffef;color:#0d703a;box-shadow-color:#75c693}.goldBtn{border-color:#d67a00;background:#fff5c7;color:#734400;box-shadow-color:#e1a43a}.purpleBtn{border-color:#6746c8;background:#f2edff;color:#5431ad;box-shadow-color:#a996e3}.dangerBtn{border-color:#cf3f42;background:#fff0f0;color:#a22b2e;box-shadow-color:#e59b9b}.doneBtn{background:#dfffe8!important;border-color:#1faa58!important;color:#087a38!important;box-shadow:0 4px 0 #7ec69a!important}.pill{display:inline-block;background:#eaf8ff;border:2px solid #8bdcff;border-radius:99px;padding:4px 9px;font-weight:1000;margin:2px}.answer{margin-top:8px;background:#edfaff;border:2px solid #7bd8ff;border-radius:12px;padding:8px 10px;text-align:center;font-weight:900;color:#073f82}.answer strong{color:#d26800}
.heroGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.heroBtn{min-height:58px;border-width:3px}.heroBtn:nth-child(1){border-color:#1887e6}.heroBtn:nth-child(2){border-color:#f0a51a}.heroBtn:nth-child(3){border-color:#22a75a}.heroBtn:nth-child(4){border-color:#8256e8}.heroBtn.selected{outline:4px solid var(--gold);background:#fff7cc}.heroName{display:block;font-size:clamp(16px,1.5vw,24px)}.heroTag{display:block;font-size:11px;opacity:.7;margin-top:2px}
.bottomNav{position:absolute;z-index:25;left:1.2%;right:1.2%;bottom:1.2%;display:flex;justify-content:space-between;align-items:center;gap:7px}.bottomNav.hidden{display:none}.navBtn.primary{border-color:var(--gold);color:#ffe45e}.turnBtn{max-width:48%;border-color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Wheel mission */
.wheelBoard{position:absolute;z-index:14;left:50%;top:20.5%;transform:translateX(-50%);width:min(94%,1180px);background:rgba(255,255,255,.96);border:4px solid #72dcff;border-radius:20px;padding:12px;pointer-events:auto;box-shadow:0 14px 34px rgba(0,64,128,.28)}.wheelBoard h3{margin:0 0 7px;text-align:center;color:#075fb8;font-size:clamp(17px,1.55vw,25px)}.wheels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.wheelWrap{text-align:center}.wheelLabel{display:inline-block;margin-bottom:6px;border-radius:99px;padding:4px 12px;font-weight:1000;color:#fff;background:#0b73d1}.wheelWrap:nth-child(2) .wheelLabel{background:#ec8a15}.wheelWrap:nth-child(3) .wheelLabel{background:#20a359}.wheelBox{position:relative;margin:auto;width:min(18vw,220px);aspect-ratio:1}.pointer{position:absolute;z-index:4;left:50%;top:-4px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:0;border-bottom:30px solid #14345d;filter:drop-shadow(0 2px 1px #fff)}.wheel{position:absolute;inset:6%;border-radius:50%;border:7px solid #0b67bc;background:conic-gradient(#ffcb3e 0 20%,#51b8ef 20% 40%,#8f63e6 40% 60%,#4fc06c 60% 80%,#f26d71 80% 100%);box-shadow:inset 0 0 0 5px #fff,0 5px 14px rgba(0,0,0,.18);transition:transform 2.6s cubic-bezier(.12,.72,.08,1)}.wheel::after{content:"";position:absolute;left:50%;top:50%;width:24%;aspect-ratio:1;border-radius:50%;background:#0a65ba;border:5px solid #fff;transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.25)}.wheelText{position:absolute;left:50%;top:50%;width:42%;text-align:center;color:#fff;text-shadow:0 2px 3px #244;font-size:clamp(9px,.78vw,13px);font-weight:1000;line-height:1.05;transform-origin:0 0}.selectedBox{margin:6px auto 0;background:#eaf8ff;border:2px solid #8bdcff;border-radius:10px;padding:5px 6px;font-weight:1000;color:#0753a2;min-height:31px}.spinMini{margin-top:6px;border:0;border-radius:10px;padding:7px 12px;font-weight:1000;color:#fff;background:#086bc8;box-shadow:0 4px 0 #064881}.spinMini.orange{background:#e78310;box-shadow-color:#a75000}.spinMini.green{background:#1c9c51;box-shadow-color:#0e6a35}.spinMini:active{transform:translateY(3px);box-shadow-width:1px}.spinAll{margin-top:8px;border:0;border-radius:12px;background:linear-gradient(#ffe05a,#ffa61b);color:#5d3600;font-weight:1000;padding:9px 20px;font-size:clamp(15px,1.3vw,21px);box-shadow:0 5px 0 #bc6500}.spinAll:active{transform:translateY(3px);box-shadow:0 2px 0 #bc6500}.wheelTask{margin-top:8px;background:#f2fbff;border:2px solid #8bdcff;border-radius:12px;padding:7px 9px;text-align:center;color:var(--ink);font-weight:900}.wheelTask .big{font-size:clamp(17px,1.55vw,25px);color:#0753a2}.spinning{filter:saturate(1.25) brightness(1.04)}
/* Modal */
.modal{position:absolute;z-index:60;inset:0;background:rgba(7,38,85,.44);display:grid;place-items:center;padding:5%}.modal.hidden{display:none}.modalCard{width:min(92%,780px);max-height:88%;overflow:auto;background:#fff;color:var(--ink);border:4px solid #74dfff;border-radius:20px;padding:17px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.3)}.modalCard h2{margin:0;color:#075fb8;font-size:clamp(24px,2.7vw,43px)}.modalCard p{font-weight:800;font-size:clamp(14px,1.2vw,19px)}.quizGrid{display:grid;gap:8px;margin:10px 0}.quizBtn{border:3px solid #7fdcff;background:#f9fdff;color:var(--ink);border-radius:12px;padding:9px 11px;text-align:left;font-weight:900}.quizBtn:hover{border-color:#ffb61e}.quizBtn.correct{background:#dfffea;border-color:#29ac5e}.quizBtn.wrong{background:#ffe3e3;border-color:#dd5454}.timer{font-size:clamp(48px,7vw,90px);font-weight:1000;color:#e07d00;text-shadow:0 3px 0 #ffe19a}.locks{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.lockBtn{border:3px solid #79d7ff;background:#fff;color:var(--ink);border-radius:12px;padding:8px 5px;font-weight:1000}.lockBtn.done{background:#dfffe8;border-color:#27ae5d}.lockNum{display:block;font-size:20px;color:#0965c1}.celebrate{font-size:clamp(26px,3.5vw,54px);color:#e77d00;font-weight:1000}
.confetti{position:absolute;z-index:80;top:-30px;width:10px;height:18px;border-radius:2px;animation:fall 2.8s linear forwards}@keyframes fall{to{transform:translate(var(--drift),115vh) rotate(820deg);opacity:.95}}
@media(max-width:900px){.stage{width:100vw;border-radius:0}.app{padding:0;align-items:flex-start}.hud{flex-direction:column}.scoreboard{width:100%;min-width:0}.topActions{top:17.2%}.wheelBoard{top:28%;}.wheelBox{width:min(25vw,190px)}.missionPanel{bottom:10%}}
@media(max-width:600px){.nameGrid{grid-template-columns:repeat(2,1fr)}.setup p{display:none}.scoreboard{grid-template-columns:repeat(2,1fr)}.wheels{gap:4px}.wheelBoard{padding:7px;top:30%}.wheelBox{width:27vw}.wheelText{font-size:7px}.missionPanel{width:97%;padding:8px}.gameBtn{padding:6px 8px}.bottomNav{gap:4px}.navBtn,.turnBtn{padding:5px 7px}.topActions{display:none}}
</style>
</head>
<body>
<div class="app">
  <main class="stage" id="stage">
    <img class="bg" id="bg" src="assets/title.png" alt="Chore Wars summer house game">
    <div class="scrim"></div>
    <header class="hud hidden" id="hud">
      <div class="progressCard"><span class="progressLabel">A1+ • GRADE 4</span><div class="progressTrack"><div class="progressFill" id="progressFill"></div></div><span class="progressText" id="progressText">0 / 7</span></div>
      <div class="scoreboard" id="scoreboard"></div>
    </header>
    <div class="topActions start" id="topActions"><button class="tinyBtn" id="soundBtn">SOUND ON</button><button class="tinyBtn" id="fullBtn">FULLSCREEN</button></div>
    <section class="setup" id="setup">
      <h2>4-PLAYER CLASS MODE</h2><p>Type student names or keep the defaults.</p>
      <div class="nameGrid">
        <label>Player 1<input id="p1" value="Player 1" maxlength="14"></label><label>Player 2<input id="p2" value="Player 2" maxlength="14"></label><label>Player 3<input id="p3" value="Player 3" maxlength="14"></label><label>Player 4<input id="p4" value="Player 4" maxlength="14"></label>
      </div>
      <button class="startBtn" id="startBtn">START MISSION</button>
    </section>
    <div class="overlay" id="overlay"></div>
    <nav class="bottomNav hidden" id="bottomNav"><button class="navBtn" id="backBtn">BACK</button><button class="turnBtn" id="turnBtn">TURN: PLAYER 1</button><button class="navBtn primary" id="nextBtn">NEXT MISSION</button></nav>
    <div class="modal hidden" id="modal"><div class="modalCard" id="modalCard"></div></div>
  </main>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const bg=$('bg'),overlay=$('overlay'),hud=$('hud'),scoreboard=$('scoreboard'),bottomNav=$('bottomNav'),progressFill=$('progressFill'),progressText=$('progressText'),turnBtn=$('turnBtn'),modal=$('modal'),modalCard=$('modalCard');
const images=['title.png','mission1.png','mission2.png','mission3.png','mission4.png','mission5.png','mission6.png','final.png'];
const heroes=[['Max','surfer'],['Mia','skater'],['Leo','gamer'],['Zoe','music fan']];
const chores=['make the bed','wash the dishes','feed the dog','water the plants','take out the rubbish','vacuum the floor'];
const whos=['my mum','my dad','my brother','my best friend','our teacher'];
const whens=['every day','every morning','on Sundays','in summer','after dinner'];
const state={scene:0,active:0,players:[1,2,3,4].map(n=>({name:'Player '+n,score:0})),done:new Set(),found:new Set(),final:new Set(),sound:true,selectedHero:null,battle:0,wheel:{who:0,chore:0,when:0},rot:{who:0,chore:0,when:0},spinning:{who:false,chore:false,when:false},timer:null};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tone(f=440,d=.1,type='sine',v=.035,delay=0){if(!state.sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;const c=tone.ctx||(tone.ctx=new AC());const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,c.currentTime+delay);g.gain.exponentialRampToValueAtTime(v,c.currentTime+delay+.01);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+delay+d);o.connect(g).connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+d+.03)}catch(e){}}
function sfx(k){if(k==='click')tone(420,.07,'square',.02);if(k==='good'){tone(523,.11,'sine',.05);tone(659,.12,'sine',.05,.08);tone(784,.16,'sine',.05,.16)}if(k==='spin'){for(let i=0;i<10;i++)tone(220+i*36,.045,'square',.014,i*.04)}if(k==='win'){[523,659,784,1046].forEach((f,i)=>tone(f,.24,'sine',.055,i*.12))}}
function renderScores(){scoreboard.innerHTML=state.players.map((p,i)=>`<button class="player ${i===state.active?'active':''}" data-i="${i}"><span>${esc(p.name)}</span><span class="score">${p.score}</span></button>`).join('');scoreboard.querySelectorAll('.player').forEach(b=>b.onclick=()=>{state.active=+b.dataset.i;renderScores();updateTurn();sfx('click')})}
function updateTurn(){turnBtn.textContent='TURN: '+state.players[state.active].name.toUpperCase()}
function point(n=1){state.players[state.active].score+=n;sfx('good');state.active=(state.active+1)%4;renderScores();updateTurn()}
function mark(n){state.done.add(n);progressFill.style.width=(state.done.size/7*100)+'%';progressText.textContent=state.done.size+' / 7'}
function setScene(n){state.scene=Math.max(1,Math.min(7,n));bg.src='assets/'+images[state.scene];overlay.innerHTML='';closeModal();$('backBtn').disabled=state.scene===1;$('nextBtn').textContent=state.scene===7?'FINISH':'NEXT MISSION';renderMission()}
function panel(html,cls=''){overlay.innerHTML=`<section class="panel missionPanel ${cls}">${html}</section>`}
function bind(id,fn){const e=$(id);if(e)e.addEventListener('click',fn)}
function renderMission(){if(state.scene===1)m1();if(state.scene===2)m2();if(state.scene===3)m3();if(state.scene===4)m4();if(state.scene===5)m5();if(state.scene===6)m6();if(state.scene===7)finalBoss()}
function m1(){panel(`<div class="missionTitle">CLICK A CHORE WHEN YOU FIND THE PROBLEM</div><div class="buttonRow">${chores.map((c,i)=>`<button class="gameBtn ${state.found.has(c)?'doneBtn':''}" data-chore="${i}">${state.found.has(c)?'FOUND: ':''}${c}</button>`).join('')}</div><div class="answer" id="m1answer">Find a problem in the house, then say a Present Simple sentence.</div>`);overlay.querySelectorAll('[data-chore]').forEach(b=>b.onclick=()=>{const c=chores[+b.dataset.chore];state.found.add(c);b.classList.add('doneBtn');b.textContent='FOUND: '+c;$('m1answer').innerHTML=`Say: <strong>I ${c}.</strong> / <strong>He or she ${third(c)}.</strong> <button class="gameBtn goodBtn" id="m1point">GOOD SENTENCE +1</button>`;bind('m1point',()=>{point();if(state.found.size>=4)mark(1)});sfx('click')})}
function third(c){if(c==='wash the dishes')return'washes the dishes';if(c==='make the bed')return'makes the bed';if(c==='feed the dog')return'feeds the dog';if(c==='water the plants')return'waters the plants';if(c==='take out the rubbish')return'takes out the rubbish';return'vacuums the floor'}
function m2(){panel(`<div class="missionTitle">CHOOSE A HERO</div><div class="heroGrid">${heroes.map((h,i)=>`<button class="gameBtn heroBtn ${state.selectedHero===i?'selected':''}" data-hero="${i}"><span class="heroName">${h[0]}</span><span class="heroTag">${h[1]}</span></button>`).join('')}</div><div class="answer" id="heroPrompt">Choose Max, Mia, Leo or Zoe.</div><div class="buttonRow"><button class="gameBtn goldBtn" id="newHeroPrompt">NEW PROMPT</button><button class="gameBtn goodBtn" id="heroPoint">SPEAKING DONE +1</button></div>`);overlay.querySelectorAll('[data-hero]').forEach(b=>b.onclick=()=>{state.selectedHero=+b.dataset.hero;m2();makeHeroPrompt();sfx('click')});bind('newHeroPrompt',makeHeroPrompt);bind('heroPoint',()=>{point();mark(2)});if(state.selectedHero!==null)makeHeroPrompt()}
function makeHeroPrompt(){if(state.selectedHero===null)return;const h=heroes[state.selectedHero][0],c=chores[Math.floor(Math.random()*chores.length)],adv=['always','usually','sometimes','never'][Math.floor(Math.random()*4)];$('heroPrompt').innerHTML=`Make a sentence: <strong>${h} / ${c} / ${adv}</strong><br><span class="subprompt">Then ask another player: “Do you ... every day?”</span>`}
function m3(){panel(`<div class="missionTitle">WHO IS THE LAZY ONE?</div><div class="subprompt">Read the clues on the detective board. Choose one suspect and explain.</div><div class="buttonRow">${heroes.map((h,i)=>`<button class="gameBtn" data-sus="${i}">${h[0]}</button>`).join('')}</div><div class="answer" id="m3a">Use: <strong>I think ... is the lazy one because ...</strong></div><div class="buttonRow"><button class="gameBtn goodBtn" id="m3point">GOOD REASON +1</button></div>`);overlay.querySelectorAll('[data-sus]').forEach(b=>b.onclick=()=>{$('m3a').innerHTML=`Your answer: <strong>I think ${heroes[+b.dataset.sus][0]} is the lazy one because ...</strong>`;sfx('click')});bind('m3point',()=>{point();mark(3)})}
const battle=[['She','make the bed'],['He','wash the dishes'],['They','water the plants'],['He','feed the dog'],['She','take out the rubbish'],['They','vacuum the floor']];
function forms(pron,c){const he=pron==='He'||pron==='She';return [pron+' '+(he?third(c):c)+'.',pron+' '+(he?"doesn't":"don't")+' '+c+'.',(he?'Does ':'Do ')+pron.toLowerCase()+' '+c+'?']}
function m4(){panel(`<div class="missionTitle">CHORE BATTLE — PICK A CARD</div><div class="buttonRow">${battle.map((x,i)=>`<button class="gameBtn ${state.battle===i?'goldBtn':''}" data-b="${i}">CARD ${i+1}</button>`).join('')}</div><div class="answer" id="battleA">Choose a card. Make affirmative → negative → question.</div><div class="buttonRow"><button class="gameBtn purpleBtn" id="reveal">REVEAL ANSWERS</button><button class="gameBtn goodBtn" id="battlePoint">3 FORMS DONE +1</button></div>`);overlay.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{state.battle=+b.dataset.b;m4();const x=battle[state.battle];$('battleA').innerHTML=`Prompt: <strong>${x[0]} / ${x[1]}</strong>`});bind('reveal',()=>{const x=battle[state.battle],f=forms(x[0],x[1]);$('battleA').innerHTML=`<strong>${f[0]}</strong><br>${f[1]}<br>${f[2]}`;sfx('click')});bind('battlePoint',()=>{point();mark(4)})}
function wheelMarkup(key,title,items,colorClass){return `<div class="wheelWrap"><div class="wheelLabel">${title}</div><div class="wheelBox"><div class="pointer"></div><div class="wheel" id="wheel-${key}">${items.map((t,i)=>`<span class="wheelText" style="transform:rotate(${i*72}deg) translateY(-39%) rotate(${-i*72}deg)">${t}</span>`).join('')}</div></div><div class="selectedBox" id="sel-${key}">${items[state.wheel[key]]}</div><button class="spinMini ${colorClass}" data-spin="${key}">SPIN ${title}</button></div>`}
function m5(){overlay.innerHTML=`<section class="wheelBoard"><h3>REAL SPINNERS — WHO + CHORE + WHEN</h3><div class="wheels">${wheelMarkup('who','WHO',whos,'')}${wheelMarkup('chore','CHORE',chores.slice(0,5),'orange')}${wheelMarkup('when','WHEN',whens,'green')}</div><div style="text-align:center"><button class="spinAll" id="spinAll">SPIN ALL 3 WHEELS</button></div><div class="wheelTask" id="wheelTask"><div class="big">${whos[state.wheel.who]} + ${chores[state.wheel.chore]} + ${whens[state.wheel.when]}</div><div>Make a sentence → make it negative → ask a question.</div><div class="buttonRow"><button class="gameBtn purpleBtn" id="wheelReveal">SHOW MODEL</button><button class="gameBtn goodBtn" id="wheelPoint">SPEAKING DONE +1</button></div></div></section>`;overlay.querySelectorAll('[data-spin]').forEach(b=>b.onclick=()=>spinWheel(b.dataset.spin));bind('spinAll',()=>{spinWheel('who');setTimeout(()=>spinWheel('chore'),130);setTimeout(()=>spinWheel('when'),260)});bind('wheelReveal',revealWheel);bind('wheelPoint',()=>{point();mark(5)})}
function spinWheel(key){if(state.spinning[key])return;const items=key==='who'?whos:key==='chore'?chores.slice(0,5):whens;const idx=Math.floor(Math.random()*items.length);state.wheel[key]=idx;const current=((state.rot[key]%360)+360)%360;const desired=((360-idx*72)%360+360)%360;const delta=1080+((desired-current+360)%360);state.rot[key]+=delta;const w=$('wheel-'+key);w.classList.add('spinning');w.style.transform=`rotate(${state.rot[key]}deg)`;$('sel-'+key).textContent='SPINNING...';sfx('spin');state.spinning[key]=true;setTimeout(()=>{state.spinning[key]=false;w.classList.remove('spinning');$('sel-'+key).textContent=items[idx];updateWheelTask()},2700)}
function updateWheelTask(){const t=$('wheelTask');if(!t)return;t.querySelector('.big').textContent=`${whos[state.wheel.who]} + ${chores[state.wheel.chore]} + ${whens[state.wheel.when]}`}
function revealWheel(){const who=whos[state.wheel.who],c=chores[state.wheel.chore],when=whens[state.wheel.when],thirdSub=/mum|dad|brother|friend|teacher/.test(who),sub=who.charAt(0).toUpperCase()+who.slice(1),aff=sub+' '+(thirdSub?third(c):c)+' '+when+'.',neg=sub+' '+(thirdSub?"doesn't":"don't")+' '+c+' '+when+'.',q=(thirdSub?'Does ':'Do ')+who+' '+c+' '+when+'?';$('wheelTask').innerHTML=`<div class="big">${aff}</div><div>${neg}<br>${q}</div><div class="buttonRow"><button class="gameBtn goldBtn" id="spinAgain">SPIN AGAIN</button><button class="gameBtn goodBtn" id="wheelPoint2">SPEAKING DONE +1</button></div>`;bind('spinAgain',m5);bind('wheelPoint2',()=>{point();mark(5)})}
function m6(){panel(`<div class="missionTitle">TWO TRUE — ONE FALSE</div><div class="prompt">Current speaker: ${esc(state.players[state.active].name)}</div><div class="subprompt">Say 3 sentences about your chores. Your friends vote for the false sentence.</div><div class="buttonRow"><button class="gameBtn" data-v="1">NUMBER 1</button><button class="gameBtn" data-v="2">NUMBER 2</button><button class="gameBtn" data-v="3">NUMBER 3</button></div><div class="answer" id="voteA">I think number ... is false.</div><div class="buttonRow"><button class="gameBtn goodBtn" id="confPoint">ROUND DONE +1</button></div>`);overlay.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{$('voteA').innerHTML=`Class vote: <strong>NUMBER ${b.dataset.v}</strong> is false!`;sfx('click')});bind('confPoint',()=>{point();mark(6);m6()})}
function finalBoss(){panel(`<div class="missionTitle">FINAL BOSS — OPEN ALL 5 LOCKS</div><div class="locks">${[1,2,3,4,5].map(n=>`<button class="lockBtn ${state.final.has(n)?'done':''}" data-lock="${n}"><span class="lockNum">${state.final.has(n)?'✓':n}</span>${['Fix it','Negative','Question','Choose','30 sec'][n-1]}</button>`).join('')}</div><div class="answer">Complete every lock to unlock the Summer Party.</div>`);overlay.querySelectorAll('[data-lock]').forEach(b=>b.onclick=()=>openLock(+b.dataset.lock));if(state.final.size===5)win()}
function openLock(n){if(n===5){timerModal();return}const qs={1:{q:'Fix it: She wash the dishes every day.',o:['She washes the dishes every day.','She wash the dishes every day.','She does washes the dishes every day.'],a:0},2:{q:'Make it negative: Tom makes his bed.',o:["Tom doesn't makes his bed.","Tom doesn't make his bed.","Tom don't make his bed."],a:1},3:{q:'Make a question: Mia waters the plants.',o:['Does Mia waters the plants?','Do Mia water the plants?','Does Mia water the plants?'],a:2},4:{q:'Choose the correct question.',o:['Does he feed the dog?','Does he feeds the dog?','Do he feed the dog?'],a:0}}[n];openModal(`<h2>LOCK ${n}</h2><p>${qs.q}</p><div class="quizGrid">${qs.o.map((x,i)=>`<button class="quizBtn" data-opt="${i}">${x}</button>`).join('')}</div><button class="gameBtn" id="closeM">CLOSE</button>`);modalCard.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.opt===qs.a;b.classList.add(ok?'correct':'wrong');if(ok){state.final.add(n);sfx('good');setTimeout(()=>{closeModal();finalBoss();if(state.final.size===5)win()},550)}});bind('closeM',closeModal)}
function timerModal(){openModal(`<h2>30-SECOND CHALLENGE</h2><p>Say 6 chores in full sentences.</p><div class="timer" id="timer">30</div><div class="buttonRow"><button class="gameBtn goldBtn" id="startTimer">START</button><button class="gameBtn goodBtn" id="timerDone">WE DID IT!</button><button class="gameBtn" id="closeM">CLOSE</button></div>`);bind('startTimer',()=>{if(state.timer)clearInterval(state.timer);let t=30;$('timer').textContent=t;state.timer=setInterval(()=>{t--;$('timer').textContent=t;if(t<=0){clearInterval(state.timer);state.timer=null;tone(170,.4,'sawtooth',.04)}},1000)});bind('timerDone',()=>{if(state.timer){clearInterval(state.timer);state.timer=null}state.final.add(5);sfx('good');closeModal();finalBoss();if(state.final.size===5)win()});bind('closeM',closeModal)}
function openModal(html){modalCard.innerHTML=html;modal.classList.remove('hidden')}
function closeModal(){modal.classList.add('hidden');if(state.timer){clearInterval(state.timer);state.timer=null}}
function win(){mark(7);sfx('win');openModal(`<div class="celebrate">SUMMER PARTY UNLOCKED!</div><p>Great job, team! All missions are complete.</p><div class="buttonRow"><button class="gameBtn goldBtn" id="again">PLAY AGAIN</button><button class="gameBtn" id="closeM">KEEP SCORES</button></div>`);confetti();bind('again',reset);bind('closeM',closeModal)}
function confetti(){const stage=$('stage');for(let i=0;i<70;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=['#ffd23f','#4fd1ff','#ff6b77','#58c979','#8e63ec'][i%5];c.style.setProperty('--drift',(Math.random()*240-120)+'px');c.style.animationDelay=(Math.random()*.7)+'s';stage.appendChild(c);setTimeout(()=>c.remove(),3600)}}
function reset(){closeModal();state.scene=1;state.active=0;state.players.forEach(p=>p.score=0);state.done.clear();state.found.clear();state.final.clear();state.selectedHero=null;state.battle=0;state.rot={who:0,chore:0,when:0};state.spinning={who:false,chore:false,when:false};progressFill.style.width='0%';progressText.textContent='0 / 7';renderScores();updateTurn();setScene(1)}
$('startBtn').onclick=()=>{state.players.forEach((p,i)=>p.name=$('p'+(i+1)).value.trim()||('Player '+(i+1)));$('setup').style.display='none';hud.classList.remove('hidden');bottomNav.classList.remove('hidden');$('topActions').classList.remove('start');renderScores();updateTurn();setScene(1);sfx('good')};
$('nextBtn').onclick=()=>{if(state.scene<7)setScene(state.scene+1);else finalBoss();sfx('click')};$('backBtn').onclick=()=>{if(state.scene>1)setScene(state.scene-1);sfx('click')};turnBtn.onclick=()=>{state.active=(state.active+1)%4;renderScores();updateTurn();sfx('click')};$('soundBtn').onclick=()=>{state.sound=!state.sound;$('soundBtn').textContent=state.sound?'SOUND ON':'SOUND OFF';if(state.sound)sfx('click')};$('fullBtn').onclick=async()=>{try{if(!document.fullscreenElement)await $('stage').requestFullscreen();else await document.exitFullscreen()}catch(e){}};
modal.onclick=e=>{if(e.target===modal)closeModal()};
window.addEventListener('error',e=>{console.error(e.error||e.message)});
})();
</script>
</body>
